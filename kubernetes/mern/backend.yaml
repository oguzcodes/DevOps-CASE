apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # CI/CD hattımız buradaki imaj adresini AWS ECR ile değiştirecek
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/mern-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5050
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb:27017/mern_db" # Kubernetes DNS üzerinden bağlanır
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5050
      targetPort: 5050